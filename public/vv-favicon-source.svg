<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8fff6e"/>
      <stop offset="50%" stop-color="#39FF14"/>
      <stop offset="100%" stop-color="#22cc00"/>
    </linearGradient>
    <radialGradient id="bg" cx="38%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#0f2a0f"/>
      <stop offset="70%" stop-color="#061206"/>
      <stop offset="100%" stop-color="#030803"/>
    </radialGradient>
  </defs>

  <!-- rounded-square dark badge -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)" stroke="url(#g)" stroke-width="14"/>

  <!-- single bold V -->
  <path d="M150,150 L256,372 L362,150"
        fill="none" stroke="url(#g)" stroke-width="52"
        stroke-linecap="butt" stroke-linejoin="miter"/>
  <!-- top cap accent -->
  <rect x="150" y="138" width="212" height="14" rx="4" fill="#39FF14" opacity="0.55"/>
</svg>
