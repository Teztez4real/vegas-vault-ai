<svg xmlns="http://www.w3.org/2000/svg" width="480" height="560" viewBox="0 0 480 560">
  <defs>

    <filter id="neon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="28" result="b3"/>
      <feMerge>
        <feMergeNode in="b3"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textglow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="depthglow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#39FF14" stroke-width="0.25" opacity="0.1"/>
    </pattern>

    <linearGradient id="scanline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0"/>
      <stop offset="50%" stop-color="#39FF14" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#39FF14" stop-opacity="0"/>
    </linearGradient>

    <style>
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.7; }
      }
      @keyframes nodepulse {
        0%, 100% { r: 4; opacity: 1; }
        50%       { r: 6; opacity: 0.65; }
      }
      @keyframes scanmove {
        0%   { transform: translateY(-20px); opacity: 0; }
        10%  { opacity: 1; }
        90%  { opacity: 1; }
        100% { transform: translateY(260px); opacity: 0; }
      }
      .top-layer { animation: pulse 3.4s ease-in-out infinite; }
      .node      { animation: nodepulse 2.8s ease-in-out infinite; }
      .scan      { animation: scanmove 4s linear infinite; }
    </style>

  </defs>

  <!-- Subtle grid — visible on both light and dark backgrounds -->
  <rect width="480" height="480" fill="url(#grid)" opacity="0.6"/>

  <!-- ── 4D DEPTH LAYERS (back → front) ── -->

  <!-- Layer 4 — deepest -->
  <g transform="translate(10,10)" opacity="0.15">
    <path d="M240,72 L388,218 L240,364 L92,218 Z" fill="none" stroke="#1a4d00" stroke-width="3"/>
    <path d="M182,138 L215,262 L240,138 M240,138 L265,262 L298,138"
          fill="none" stroke="#1a4d00" stroke-width="13" stroke-linecap="butt" stroke-linejoin="miter"/>
  </g>

  <!-- Layer 3 -->
  <g transform="translate(7,7)" opacity="0.28">
    <path d="M240,72 L388,218 L240,364 L92,218 Z" fill="none" stroke="#1f6600" stroke-width="2.5"/>
    <path d="M182,138 L215,262 L240,138 M240,138 L265,262 L298,138"
          fill="none" stroke="#1f6600" stroke-width="12" stroke-linecap="butt" stroke-linejoin="miter"/>
  </g>

  <!-- Layer 2 -->
  <g transform="translate(4,4)" opacity="0.48">
    <path d="M240,72 L388,218 L240,364 L92,218 Z" fill="none" stroke="#228800" stroke-width="2"/>
    <path d="M182,138 L215,262 L240,138 M240,138 L265,262 L298,138"
          fill="none" stroke="#228800" stroke-width="11" stroke-linecap="butt" stroke-linejoin="miter"/>
  </g>

  <!-- Layer 1 -->
  <g transform="translate(2,2)" opacity="0.7">
    <path d="M240,72 L388,218 L240,364 L92,218 Z" fill="none" stroke="#2db800" stroke-width="1.8"/>
    <path d="M182,138 L215,262 L240,138 M240,138 L265,262 L298,138"
          fill="none" stroke="#2db800" stroke-width="10.5" stroke-linecap="butt" stroke-linejoin="miter"/>
  </g>

  <!-- Diamond face — transparent fill to show app background through it -->
  <path d="M240,72 L388,218 L240,364 L92,218 Z" fill="transparent"/>

  <!-- Diamond border — neon front -->
  <path d="M240,72 L388,218 L240,364 L92,218 Z"
        fill="none" stroke="#39FF14" stroke-width="2.5" filter="url(#neon)"/>

  <!-- Inner ring -->
  <path d="M240,102 L358,218 L240,334 L122,218 Z"
        fill="none" stroke="#39FF14" stroke-width="0.7" opacity="0.2"/>

  <!-- Scan line -->
  <clipPath id="dclip">
    <path d="M240,72 L388,218 L240,364 L92,218 Z"/>
  </clipPath>
  <rect x="92" y="72" width="296" height="6" fill="url(#scanline)"
        clip-path="url(#dclip)" class="scan"/>

  <!-- ── VV LETTERMARK ── -->
  <g class="top-layer">
    <path d="M178,136 L216,270 L254,136"
          fill="none" stroke="#39FF14" stroke-width="14"
          stroke-linecap="butt" stroke-linejoin="miter"
          filter="url(#neon)"/>
    <path d="M226,136 L264,270 L302,136"
          fill="none" stroke="#39FF14" stroke-width="14"
          stroke-linecap="butt" stroke-linejoin="miter"
          filter="url(#neon)"/>
    <line x1="178" y1="136" x2="302" y2="136"
          stroke="#39FF14" stroke-width="3.5" opacity="0.4"
          filter="url(#depthglow)"/>
  </g>

  <!-- Corner nodes -->
  <circle cx="240" cy="72"  r="4" fill="#39FF14" class="node" filter="url(#neon)" style="animation-delay:0s"/>
  <circle cx="388" cy="218" r="4" fill="#39FF14" class="node" filter="url(#neon)" style="animation-delay:0.7s"/>
  <circle cx="240" cy="364" r="4" fill="#39FF14" class="node" filter="url(#neon)" style="animation-delay:1.4s"/>
  <circle cx="92"  cy="218" r="4" fill="#39FF14" class="node" filter="url(#neon)" style="animation-delay:2.1s"/>

  <!-- Depth connector edges -->
  <line x1="240" y1="72"  x2="250" y2="82"  stroke="#39FF14" stroke-width="1" opacity="0.25"/>
  <line x1="388" y1="218" x2="398" y2="228" stroke="#39FF14" stroke-width="1" opacity="0.25"/>
  <line x1="240" y1="364" x2="250" y2="374" stroke="#39FF14" stroke-width="1" opacity="0.25"/>
  <line x1="92"  y1="218" x2="102" y2="228" stroke="#39FF14" stroke-width="1" opacity="0.25"/>

  <!-- ── WORDMARK ── -->
  <line x1="100" y1="396" x2="380" y2="396" stroke="#39FF14" stroke-width="0.5" opacity="0.25"/>

  <!-- VEGAS VAULT — dark so it reads on light backgrounds -->
  <text x="240" y="428"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="20" font-weight="800" letter-spacing="9"
        fill="#111111" text-anchor="middle">VEGAS VAULT</text>

  <!-- AI — neon green -->
  <text x="240" y="468"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="36" font-weight="900" letter-spacing="18"
        fill="#39FF14" text-anchor="middle"
        filter="url(#textglow)">AI</text>

  <!-- Tagline -->
  <text x="240" y="500"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="8.5" font-weight="400" letter-spacing="5.5"
        fill="#888888" text-anchor="middle">A I  ·  M O D E L  ·  O S</text>

  <!-- Flanking lines -->
  <line x1="68"  y1="428" x2="110" y2="428" stroke="#39FF14" stroke-width="0.6" opacity="0.3"/>
  <line x1="370" y1="428" x2="412" y2="428" stroke="#39FF14" stroke-width="0.6" opacity="0.3"/>

</svg>
