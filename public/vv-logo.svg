<svg xmlns="http://www.w3.org/2000/svg" width="480" height="560" viewBox="0 0 480 560">
  <defs>

    <!-- Neon glow — strong, multi-pass -->
    <filter id="neon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="28" result="b3"/>
      <feMerge>
        <feMergeNode in="b3"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle glow for text -->
    <filter id="textglow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Inner shadow for depth face -->
    <filter id="depthglow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Radial vignette for background -->
    <radialGradient id="vignette" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#0d1a0d"/>
      <stop offset="100%" stop-color="#020502"/>
    </radialGradient>

    <!-- Green radial glow behind mark -->
    <radialGradient id="markglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#39FF14" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#39FF14" stroke-width="0.25" opacity="0.12"/>
    </pattern>

    <!-- Diagonal scan line -->
    <linearGradient id="scanline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0"/>
      <stop offset="50%" stop-color="#39FF14" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#39FF14" stop-opacity="0"/>
    </linearGradient>

    <!-- Pulse animation keyframes -->
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.72; }
      }
      @keyframes nodepulse {
        0%, 100% { r: 4; opacity: 1; }
        50%       { r: 6; opacity: 0.7; }
      }
      @keyframes scanmove {
        0%   { transform: translateY(-20px); opacity: 0; }
        10%  { opacity: 1; }
        90%  { opacity: 1; }
        100% { transform: translateY(260px); opacity: 0; }
      }
      .top-layer  { animation: pulse 3.4s ease-in-out infinite; }
      .node       { animation: nodepulse 2.8s ease-in-out infinite; }
      .scan       { animation: scanmove 4s linear infinite; }
    </style>

  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="480" height="560" fill="#030603"/>
  <rect width="480" height="560" fill="url(#vignette)"/>
  <rect width="480" height="560" fill="url(#grid)"/>

  <!-- Ambient glow behind mark -->
  <ellipse cx="240" cy="218" rx="175" ry="165" fill="url(#markglow)"/>

  <!-- ── 4D DEPTH LAYERS (back → front) ── -->

  <!-- Diamond path: top(240,72) right(388,218) bottom(240,364) left(92,218) -->

  <!-- LAYER 4 — deepest shadow -->
  <g transform="translate(10,10)" opacity="0.18">
    <path d="M240,72 L388,218 L240,364 L92,218 Z"
          fill="none" stroke="#0a2600" stroke-width="3"/>
    <path d="M182,138 L215,262 M215,262 L240,138 M240,138 L265,262 L298,138"
          fill="none" stroke="#0a2600" stroke-width="10" stroke-linecap="butt" stroke-linejoin="miter"/>
  </g>

  <!-- LAYER 3 -->
  <g transform="translate(7,7)" opacity="0.32">
    <path d="M240,72 L388,218 L240,364 L92,218 Z"
          fill="none" stroke="#0f3d00" stroke-width="2.5"/>
    <path d="M182,138 L215,262 M215,262 L240,138 M240,138 L265,262 L298,138"
          fill="none" stroke="#0f3d00" stroke-width="9.5" stroke-linecap="butt" stroke-linejoin="miter"/>
  </g>

  <!-- LAYER 2 -->
  <g transform="translate(4,4)" opacity="0.52">
    <path d="M240,72 L388,218 L240,364 L92,218 Z"
          fill="none" stroke="#1a6600" stroke-width="2"/>
    <path d="M182,138 L215,262 M215,262 L240,138 M240,138 L265,262 L298,138"
          fill="none" stroke="#1a6600" stroke-width="9" stroke-linecap="butt" stroke-linejoin="miter"/>
  </g>

  <!-- LAYER 1 -->
  <g transform="translate(2,2)" opacity="0.72">
    <path d="M240,72 L388,218 L240,364 L92,218 Z"
          fill="none" stroke="#2aaa00" stroke-width="1.8"/>
    <path d="M182,138 L215,262 M215,262 L240,138 M240,138 L265,262 L298,138"
          fill="none" stroke="#2aaa00" stroke-width="9" stroke-linecap="butt" stroke-linejoin="miter"/>
  </g>

  <!-- ── MAIN LAYER (front face) ── -->

  <!-- Diamond border — the Vault frame -->
  <path d="M240,72 L388,218 L240,364 L92,218 Z"
        fill="#030603" stroke="#39FF14" stroke-width="2.2"
        filter="url(#neon)"/>

  <!-- Inner diamond ring -->
  <path d="M240,102 L358,218 L240,334 L122,218 Z"
        fill="none" stroke="#39FF14" stroke-width="0.6" opacity="0.22"/>

  <!-- Subtle fill gradient on the diamond face -->
  <path d="M240,72 L388,218 L240,364 L92,218 Z"
        fill="#39FF14" opacity="0.018"/>

  <!-- Scan line moving through mark (clip to diamond) -->
  <clipPath id="diamondclip">
    <path d="M240,72 L388,218 L240,364 L92,218 Z"/>
  </clipPath>
  <rect x="92" y="72" width="296" height="6" fill="url(#scanline)"
        clip-path="url(#diamondclip)" class="scan"/>

  <!-- ── VV LETTERMARK (top / neon layer) ── -->
  <g class="top-layer">

    <!-- The VV: two connected V's sharing negative space center -->
    <!-- Left V: descends to point at (216, 270) -->
    <path d="M178,136 L216,270 L254,136"
          fill="none" stroke="#39FF14" stroke-width="14"
          stroke-linecap="butt" stroke-linejoin="miter"
          filter="url(#neon)"/>

    <!-- Right V: descends to point at (264, 270) — shares left stroke with Left V's right arm -->
    <path d="M226,136 L264,270 L302,136"
          fill="none" stroke="#39FF14" stroke-width="14"
          stroke-linecap="butt" stroke-linejoin="miter"
          filter="url(#neon)"/>

    <!-- Horizontal cap line — connects top of both V's -->
    <line x1="178" y1="136" x2="302" y2="136"
          stroke="#39FF14" stroke-width="3.5" opacity="0.45"
          filter="url(#depthglow)"/>

  </g>

  <!-- ── CORNER NODES (live data points) ── -->
  <circle cx="240" cy="72"  r="4" fill="#39FF14" class="node" filter="url(#neon)" style="animation-delay:0s"/>
  <circle cx="388" cy="218" r="4" fill="#39FF14" class="node" filter="url(#neon)" style="animation-delay:0.7s"/>
  <circle cx="240" cy="364" r="4" fill="#39FF14" class="node" filter="url(#neon)" style="animation-delay:1.4s"/>
  <circle cx="92"  cy="218" r="4" fill="#39FF14" class="node" filter="url(#neon)" style="animation-delay:2.1s"/>

  <!-- Depth connector lines (perspective edges) -->
  <line x1="240" y1="72"  x2="250" y2="82"  stroke="#39FF14" stroke-width="1" opacity="0.28"/>
  <line x1="388" y1="218" x2="398" y2="228" stroke="#39FF14" stroke-width="1" opacity="0.28"/>
  <line x1="240" y1="364" x2="250" y2="374" stroke="#39FF14" stroke-width="1" opacity="0.28"/>
  <line x1="92"  cy1="218" x2="102" y2="228" stroke="#39FF14" stroke-width="1" opacity="0.28"/>

  <!-- ── WORDMARK ── -->

  <!-- Divider line -->
  <line x1="100" y1="396" x2="380" y2="396" stroke="#39FF14" stroke-width="0.5" opacity="0.2"/>

  <!-- VEGAS VAULT -->
  <text x="240" y="428"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="20" font-weight="800" letter-spacing="9"
        fill="#ffffff" text-anchor="middle" opacity="0.92">VEGAS VAULT</text>

  <!-- AI — neon, bold, glowing -->
  <text x="240" y="468"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="36" font-weight="900" letter-spacing="18"
        fill="#39FF14" text-anchor="middle"
        filter="url(#textglow)">AI</text>

  <!-- Tagline -->
  <text x="240" y="500"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="8.5" font-weight="400" letter-spacing="5.5"
        fill="#39FF14" opacity="0.4" text-anchor="middle">A I  ·  M O D E L  ·  O S</text>

  <!-- Flanking marks next to VEGAS VAULT -->
  <line x1="68"  y1="428" x2="110" y2="428" stroke="#39FF14" stroke-width="0.6" opacity="0.25"/>
  <line x1="370" y1="428" x2="412" y2="428" stroke="#39FF14" stroke-width="0.6" opacity="0.25"/>

</svg>
